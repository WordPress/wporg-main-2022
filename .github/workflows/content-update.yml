name: Sync page content

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # Runs hourly
  push:
    branches: [trunk]
    # Only the manifest and the export/parser code change what build:patterns
    # produces from the live site; regenerate patterns when those change.
    paths:
      - 'env/page-manifest.json'
      - 'env/export-content/**'
      - 'env/build-patterns.sh'
  pull_request:
    paths:
      - '.github/workflows/content-update.yml'
      - 'env/add-page.js'
      - 'env/screenshot-changes.js'

# Per ref, so pull request runs and trunk syncs don't cancel each other.
concurrency:
  group: content-update-${{ github.ref }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Read-only: generates patterns and screenshots and hands the files to the publish job.
  sync:
    if: github.repository_owner == 'WordPress'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changelist: ${{ steps.build-patterns.outputs.changelist }}
      content-hash: ${{ steps.content-hash.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Setup
        uses: ./.github/actions/setup

      # The 0-sandbox.php file mapping's mountpoint resolves into the repo's
      # mu-plugins directory, which all of the environment's containers bind.
      # Containers starting concurrently race to create the missing placeholder
      # (runc uses O_EXCL) and the loser fails with a "file exists" mount error.
      # Pre-creating it removes the race; inside the containers the bind mount
      # covers it with env/0-sandbox.php. The path is gitignored.
      - name: Pre-create the 0-sandbox.php mountpoint
        run: touch source/wp-content/mu-plugins/0-sandbox.php

      # Puppeteer downloads Chrome in its npm postinstall script, which is
      # skipped when node_modules is restored from cache, so the browser is
      # cached and ensured separately. The install is a no-op when present.
      - name: Restore Puppeteer Chrome
        id: puppeteer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      # Saved here, before any page content is processed.
      - name: Save Puppeteer Chrome
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: ${{ steps.puppeteer-cache.outputs.cache-primary-key }}

      # The screenshots need built theme assets.
      - name: Build the theme
        run: npm run build:theme

      - name: Add new pages to the manifest
        run: npm run add:page -- --new

      - name: Run the content update
        id: build-patterns
        run: |
          chmod -R ugo+w source/wp-content/themes/wporg-main-2022/
          # Same build as WordPress/WordPress#master, without wp-env cloning every branch and tag.
          echo '{ "testsEnvironment": false, "core": "https://wordpress.org/nightly-builds/wordpress-latest.zip" }' > .wp-env.override.json
          npx wp-env start --update
          npm run setup:wp
          mkdir -p "$GITHUB_WORKSPACE/artifacts/"
          npm run build:patterns
          # Lists new patterns too, so pages added to the manifest get screenshots.
          CHANGED_FILES=$(git ls-files --modified --others --exclude-standard -- 'source/wp-content/themes/wporg-main-2022/patterns/*.php')
          echo "$CHANGED_FILES"
          {
            echo 'changelist<<EOF'
            echo "$CHANGED_FILES" | xargs npm run --silent screenshot-changes --
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Identifies the screenshot comment for this content, independent of the PR branch's commits.
      - name: Hash the synced content
        id: content-hash
        run: |
          git add --all -- env/page-manifest.json 'source/wp-content/themes/wporg-main-2022/patterns/*.php' 'source/wp-content/themes/wporg-main-2022/templates/*.html'
          echo "hash=$(git diff --cached | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Upload synced files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synced-content
          path: |
            env/page-manifest.json
            source/wp-content/themes/wporg-main-2022/patterns/*.php
            source/wp-content/themes/wporg-main-2022/templates/*.html
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-artifacts
          path: "${{ github.workspace }}/artifacts/"

  # Has write access, so it only runs git and the GitHub API, never code from the repo or the synced content.
  publish:
    needs: sync
    # Only from trunk; branch and pull request runs stop after the sync.
    if: github.ref_name == 'trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # Required to push the PR and screenshot branches.
      pull-requests: write # Required to create a PR and comment on it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download synced files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synced-content

      - name: Download screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshot-artifacts
          path: artifacts

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/content-update
          delete-branch: true
          add-paths: |
            env/page-manifest.json
            source/wp-content/themes/wporg-main-2022/patterns/*.php
            source/wp-content/themes/wporg-main-2022/templates/*.html
          title: 'Content updates from Page Editor'
          labels: Automated Content Update
          commit-message: '[automated] Sync content from Page Editor.'
          body: |
            The following pages have been added or updated in the Page Editor.
            ```
            ${{ needs.sync.outputs.changelist }}
            ```

            Please review, merge, and deploy.

      # Posts once per content: not again after unrelated trunk merges, and still after a cancelled run.
      - name: Check for screenshots of this content
        id: screenshots
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automated/content-update --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ] && [ -s artifacts/screenshots.md ] && ! gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF "<!-- content-hash: $CONTENT_HASH -->"; then
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONTENT_HASH: ${{ needs.sync.outputs.content-hash }}

      - name: Push screenshots to storage branch
        id: push-screenshots
        if: steps.screenshots.outputs.pr
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BRANCH="content-update-screenshots"

          cd /tmp
          git clone --depth=1 "$REPO_URL" --branch "$BRANCH" screenshots-repo 2>/dev/null || {
            mkdir -p screenshots-repo && cd screenshots-repo && git init
            git remote add origin "$REPO_URL"
            git checkout --orphan "$BRANCH"
          }
          cd /tmp/screenshots-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r "$GITHUB_WORKSPACE/artifacts/before" . 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/artifacts/after" . 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/artifacts/diff" . 2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "Screenshots for content update"
            git push origin HEAD:refs/heads/$BRANCH
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Post screenshot comment
        if: steps.push-screenshots.outcome == 'success'
        run: |
          sed -i "s|/${SCREENSHOTS_PLACEHOLDER}/|/${SCREENSHOTS_SHA}/|g" artifacts/screenshots.md
          printf '\n<!-- content-hash: %s -->\n' "$CONTENT_HASH" >> artifacts/screenshots.md
          gh pr comment "$PR_NUMBER" --body-file artifacts/screenshots.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.screenshots.outputs.pr }}
          CONTENT_HASH: ${{ needs.sync.outputs.content-hash }}
          SCREENSHOTS_PLACEHOLDER: content-update-screenshots
          SCREENSHOTS_SHA: ${{ steps.push-screenshots.outputs.sha }}
