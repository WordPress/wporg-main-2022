name: Update existing content

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # Runs daily at 3:17 AM UTC
  push:
    branches: [trunk]
    # Only the manifest and the export/parser code change what build:patterns
    # produces from the live site; regenerate patterns when those change.
    paths:
      - 'env/page-manifest.json'
      - 'env/export-content/**'
      - 'env/build-patterns.sh'
  pull_request:
    paths:
      - '.github/workflows/content-update.yml'
      - 'env/screenshot-changes.js'

concurrency:
  group: content-update
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  content-update:
    if: github.repository_owner == 'WordPress'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # Required to clone the repo and push the branches.
      pull-requests: write # Required to create a PR and comment on it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PRs check out the PR branch; a manual run uses the branch selected in the
          # UI; scheduled/push runs always operate on trunk (the content-sync target).
          ref: ${{ (github.event_name == 'pull_request' && github.head_ref) || (github.event_name == 'workflow_dispatch' && github.ref_name) || 'trunk' }}

      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Setup
        uses: ./.github/actions/setup

      - name: Get cache week
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      # Caches the WordPress/WordPress#master checkout wp-env downloads.
      # Cache entries are immutable, so the key rotates weekly; `restore-keys`
      # seeds from the newest snapshot and `--update` fetches only the delta.
      - name: Cache WordPress source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # wp-env uses `~/wp-env` on hosts with Snap (like Ubuntu runners)
          # and `~/.wp-env` elsewhere.
          path: |
            ~/wp-env
            ~/.wp-env
          key: wp-env-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('.wp-env.json') }}
          restore-keys: |
            wp-env-${{ runner.os }}-

      # The 0-sandbox.php file mapping's mountpoint resolves into the repo's
      # mu-plugins directory, which all of the environment's containers bind.
      # Containers starting concurrently race to create the missing placeholder
      # (runc uses O_EXCL) and the loser fails with a "file exists" mount error.
      # Pre-creating it removes the race; inside the containers the bind mount
      # covers it with env/0-sandbox.php. The path is gitignored.
      - name: Pre-create the 0-sandbox.php mountpoint
        run: touch source/wp-content/mu-plugins/0-sandbox.php

      # Puppeteer downloads Chrome in its npm postinstall script, which is
      # skipped when node_modules is restored from cache, so the browser is
      # cached and ensured separately. The install is a no-op when present.
      - name: Cache Puppeteer Chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      # The screenshots need built theme assets.
      - name: Build the theme
        run: npm run build:theme

      - name: Run the content update
        id: build-patterns
        run: |
          chmod -R ugo+w source/wp-content/themes/wporg-main-2022/
          echo '{ "testsEnvironment": false }' > .wp-env.override.json
          npx wp-env start --update
          npm run setup:wp
          mkdir -p "$GITHUB_WORKSPACE/artifacts/"
          npm run build:patterns
          CHANGED_FILES=$(git diff --name-only source/wp-content/themes/wporg-main-2022/**/*.php)
          echo "$CHANGED_FILES"
          {
            echo 'changelist<<EOF'
            echo "$CHANGED_FILES" | xargs npm run --silent screenshot-changes --
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Push screenshots to storage branch
        id: push-screenshots
        # Only write to the shared storage branch from trunk, so branch/PR runs
        # exercise the sync without mutating shared refs.
        if: github.ref_name == 'trunk'
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BRANCH="content-update-screenshots"

          cd /tmp
          git clone --depth=1 "$REPO_URL" --branch "$BRANCH" screenshots-repo 2>/dev/null || {
            mkdir -p screenshots-repo && cd screenshots-repo && git init
            git remote add origin "$REPO_URL"
            git checkout --orphan "$BRANCH"
          }
          cd /tmp/screenshots-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r "$GITHUB_WORKSPACE/artifacts/before" . 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/artifacts/after" . 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/artifacts/diff" . 2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "Screenshots for content update"
            git push origin HEAD:refs/heads/$BRANCH
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Resolve screenshot URLs
        run: |
          if [ -f "$GITHUB_WORKSPACE/artifacts/screenshots.md" ]; then
            sed -i "s|/${{ env.SCREENSHOTS_PLACEHOLDER }}/|/${{ steps.push-screenshots.outputs.sha }}/|g" "$GITHUB_WORKSPACE/artifacts/screenshots.md"
          fi
        env:
          SCREENSHOTS_PLACEHOLDER: content-update-screenshots

      - name: Upload screenshots
        id: upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-artifacts
          path: "${{ github.workspace }}/artifacts/"

      - name: Create Pull Request
        id: create-pr
        # Only open the content-update PR from trunk; branch/PR runs stop after diffing.
        if: github.ref_name == 'trunk'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/content-update
          delete-branch: true
          add-paths: source/wp-content/themes/wporg-main-2022/**/*.php
          title: 'Content updates from Page Editor'
          labels: Automated Content Update
          commit-message: '[automated] Sync content from Page Editor.'
          body: |
            The following pages have been updated in the Page Editor.
            ```
            ${{ steps.build-patterns.outputs.changelist }}
            ```

            Please review, merge, and deploy.

      - name: Post screenshot comment
        if: steps.create-pr.outputs.pull-request-number
        run: |
          if [ -f "$GITHUB_WORKSPACE/artifacts/screenshots.md" ] && [ -s "$GITHUB_WORKSPACE/artifacts/screenshots.md" ]; then
            gh pr comment "${{ steps.create-pr.outputs.pull-request-number }}" --body-file "$GITHUB_WORKSPACE/artifacts/screenshots.md"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
