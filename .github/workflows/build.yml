name: Build and push to build branch.

on:
  push:
    branches: [trunk]

concurrency:
  group: build
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Required to clone the repo and push to the build branch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk

      # The webpack build is self-contained, so PHP/Composer are not needed.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          skip-composer: true

      - name: Build the theme
        run: npm run build:theme

      # node_modules and .github are parked in $RUNNER_TEMP and restored after
      # the push: the setup action's post steps need .github/actions/setup to
      # save the caches at the end of the job.
      - name: Trim the repo down to just the theme
        run: |
          rm -rf source/wp-content/themes/wporg-main-2022/node_modules
          mv node_modules "$RUNNER_TEMP"
          cp -r .github "$RUNNER_TEMP"
          mv source/wp-content/themes/wporg-main-2022 $RUNNER_TEMP
          git rm -rfq .
          rm -rf *
          mv $RUNNER_TEMP/wporg-main-2022/* .

      - name: Add all the theme files
        run: |
          git add * --force

      - name: Append build number to version
        run: |
          current_version=$(grep -oP 'Version: \K[0-9]+\.[0-9]+\.[0-9]+' style.css)
          new_version="${current_version}-${GITHUB_SHA::7}"
          sed -i "s/Version: $current_version/Version: $new_version/" style.css

      - name: Commit and push
        uses: actions-js/push@a52398fac807b0c1e5f1492c969b477c8560a0ba # 1.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: build
          force: true
          message: 'Build: ${{ github.sha }}'

      - name: Restore action files and node_modules for the cache save
        run: |
          mv "$RUNNER_TEMP/node_modules" node_modules
          rm -rf .github
          mv "$RUNNER_TEMP/.github" .github
